# ============================================================
# SIGMA EVENTS — Configuration Nginx
# Placer dans /etc/nginx/sites-available/sigma-events
# ============================================================

# Rate limiting (anti-DDoS / anti-bot)
limit_req_zone $binary_remote_addr zone=sigma_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=sigma_api:10m rate=10r/s;

# Upstream Next.js
upstream sigma_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name sigma-events.com www.sigma-events.com;

    # Redirection HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sigma-events.com www.sigma-events.com;

    # --- SSL (Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/sigma-events.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigma-events.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Sécurité ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Taille max upload (images événements) ---
    client_max_body_size 10M;

    # --- Compression gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --- Cache statique ---
    location /_next/static/ {
        proxy_pass http://sigma_nextjs;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /public/ {
        proxy_pass http://sigma_nextjs;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Webhook FeexPay (pas de rate limit) ---
    location /api/webhook/ {
        proxy_pass http://sigma_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pas de timeout pour les webhooks
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- API routes (rate limit) ---
    location /api/ {
        limit_req zone=sigma_api burst=20 nodelay;

        proxy_pass http://sigma_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- WebSocket (Ably temps réel) ---
    location /ably/ {
        proxy_pass http://sigma_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # --- Routes principales ---
    location / {
        limit_req zone=sigma_general burst=50 nodelay;

        proxy_pass http://sigma_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Favicon / robots.txt ---
    location = /favicon.ico {
        proxy_pass http://sigma_nextjs;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        proxy_pass http://sigma_nextjs;
        expires 1d;
    }
}
