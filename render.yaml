# ============================================================
# SIGMA EVENTS — Blueprint Render
# Déploiement : web (Next.js) + PostgreSQL managé + worker email.
# ============================================================

databases:
  - name: sigma-events-db
    plan: free
    databaseName: sigma
    user: sigma

services:
  - type: web
    name: sigma-events
    runtime: node
    plan: free
    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npx prisma generate --schema prisma/schema.postgres.prisma
      npm run build
    startCommand: |
      npx prisma migrate deploy --schema prisma/schema.postgres.prisma
      npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: sigma-events-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: TICKET_QR_SECRET
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: CLOUDAMQP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Sigma Security <onboarding@resend.dev>"
      - key: FEEXPAY_PRIVATE_KEY
        sync: false
      - key: FEEXPAY_IDENTIFIER
        sync: false
      - key: FEEXPAY_MODE
        value: "LIVE"
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_BASE_URL
        sync: false
      - key: INFOBIP_SENDER
        value: "SIGMA"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_ENV
        value: "sandbox"
      - key: PAYOUT_ADMIN_THRESHOLD
        value: "100000"
      - key: NODE_ENV
        value: production

  - type: web
    name: sigma-events-worker
    runtime: node
    plan: free
    healthCheckPath: /
    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npx prisma generate --schema prisma/schema.postgres.prisma
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: sigma-events-db
          property: connectionString
      - key: CLOUDAMQP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Sigma Security <onboarding@resend.dev>"
      - key: APP_URL
        sync: false
