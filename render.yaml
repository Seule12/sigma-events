# ============================================================
# SIGMA EVENTS — Blueprint Render
# ============================================================

databases:
  - name: sigma-events-db
    plan: free
    databaseName: sigma
    user: sigma

services:
  - type: web
    name: sigma-events
    runtime: node
    plan: free
    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npx prisma generate --schema prisma/schema.postgres.prisma
      npm run build
    startCommand: |
      npx prisma migrate deploy --schema prisma/schema.postgres.prisma
      npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sigma-events-db
          property: connectionString

  - type: web
    name: sigma-events-worker
    runtime: node
    plan: free
    healthCheckPath: /
    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npx prisma generate --schema prisma/schema.postgres.prisma
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: sigma-events-db
          property: connectionString
