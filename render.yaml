# ============================================================
# SIGMA EVENTS — Render Blueprint
# Toutes les variables d'env sont gérées via le dashboard Render.
# ============================================================

services:
  - type: web
    name: sigma-events
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npx prisma generate --schema prisma/schema.postgres.prisma
      npm run build
    startCommand: |
      npx prisma migrate deploy --schema prisma/schema.postgres.prisma
      npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
