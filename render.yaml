# ============================================================
# SIGMA EVENTS — Blueprint Render
# Déploiement : web (Next.js) + PostgreSQL managé + worker email.
# ============================================================

databases:
  - name: sigma-events-db
    plan: free
    databaseName: sigma
    user: sigma

services:
  - type: web
    name: sigma-events
    runtime: node
    plan: free
    buildCommand: |
      npm ci
      npx prisma generate --schema prisma/schema.prisma
      npx prisma generate --schema prisma/schema.postgres.prisma
      npm run build
    startCommand: |
      npx prisma migrate deploy --schema prisma/schema.postgres.prisma
      npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: sigma-events-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: TICKET_QR_SECRET
        value: "f976b30939a8fd2a43ec890cf915fb2447ffe717e4857dcafd1e64d02ffa688d"
